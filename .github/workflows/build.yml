name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Build frontend
        run: npm run build:frontend

      - name: Bundle backend (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --onedir --noconsole --name ssa-backend \
            --paths=backend \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan.on \
            backend/run_server.py

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Upload installer artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: smart-set-architect-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Upload installer artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: smart-set-architect-macos
          path: release/*.dmg
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: smart-set-architect-windows
          path: installers/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: smart-set-architect-macos
          path: installers/macos

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            installers/windows/*.exe
            installers/macos/*.dmg
          fail_on_unmatched_files: true